.dot-floating {
    position: relative;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: #0067b8;
    color: #0067b8;
    -webkit-animation: dot-floating 2s infinite cubic-bezier(0.15, 0.6, 0.9, 0.1);
    animation: dot-floating 2s infinite cubic-bezier(0.15, 0.6, 0.9, 0.1);
    margin-left: 220px;
}

.dot-floating::before,
.dot-floating::after {
    content: '';
    display: inline-block;
    position: absolute;
    /* top: 0; */
}

.dot-floating::before {
    left: -12px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: #0067b8;
    color: #0067b8;
    -webkit-animation: dot-floating-before 2s infinite ease-in-out;
    animation: dot-floating-before 2s infinite ease-in-out;
}

.dot-floating::after {
    left: -12px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: #0067b8;
    color: #0067b8;
    -webkit-animation: dot-floating-after 3s infinite cubic-bezier(0.4, 0, 1, 1);
    animation: dot-floating-after 2s infinite cubic-bezier(0.4, 0, 1, 1);
}

@-webkit-keyframes dot-floating {
    0% {
        left: calc(-50% - 5px);
    }
    75% {
        left: calc(50% + 105px);
    }
    100% {
        left: calc(50% + 105px);
    }
}

@keyframes dot-floating {
    0% {
        left: calc(-50% - 5px);
    }
    75% {
        left: calc(50% + 105px);
    }
    100% {
        left: calc(50% + 105px);
    }
}

    0% {
        left: -50px;
    }

        left: -12px;

        left: -50px;
    }
    100% {
        left: -50px;
    }
}
